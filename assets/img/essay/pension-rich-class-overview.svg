<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1024" width="1200" height="1024" role="img" aria-label="연금 부자 수업 한눈에 보기 — 생애주기별 자산 흐름, 4개 통장의 역할과 한도, 연금 수령 5단계 전략">
<rect width="1200" height="1024" fill="#fcfcfb"/>
<text x="48" y="54" font-size="28" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">《연금 부자 수업》 한눈에 보기</text>
<text x="48" y="84" font-size="15" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">4개의 통장으로 평생 월급 만들기 — 책 내용을 바탕으로 재구성</text>
<rect x="48.0" y="170" width="392.8" height="18" rx="4" fill="#86b6ef"/>
<text x="245.1" y="136" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">적립기</text>
<text x="245.1" y="156" font-size="13" fill="#52514e" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">(적극적 자산배분)</text>
<rect x="443.8" y="170" width="154.7" height="18" rx="4" fill="#3987e5"/>
<text x="521.1" y="136" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">전환기</text>
<text x="521.1" y="156" font-size="13" fill="#52514e" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">(보수적 자산배분)</text>
<rect x="601.5" y="170" width="550.5" height="18" rx="4" fill="#1c5cab"/>
<text x="876.0" y="136" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">수령기</text>
<text x="876.0" y="156" font-size="13" fill="#52514e" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">(배당 현금흐름)</text>
<line x1="48.0" y1="188" x2="48.0" y2="194" stroke="#898781" stroke-width="1"/>
<text x="48.0" y="212" font-size="13" fill="#898781" text-anchor="start" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">30세</text>
<line x1="442.3" y1="188" x2="442.3" y2="194" stroke="#898781" stroke-width="1"/>
<text x="442.3" y="212" font-size="13" fill="#898781" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">55세</text>
<line x1="600.0" y1="188" x2="600.0" y2="194" stroke="#898781" stroke-width="1"/>
<text x="600.0" y="212" font-size="13" fill="#898781" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">65세</text>
<line x1="1152.0" y1="188" x2="1152.0" y2="194" stroke="#898781" stroke-width="1"/>
<text x="1152.0" y="212" font-size="13" fill="#898781" text-anchor="end" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">100세</text>
<text x="48" y="268" font-size="20" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">4개의 통장, 역할과 한도</text>
<text x="48" y="302" font-size="13" fill="#898781" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">구분</text>
<text x="250" y="302" font-size="13" fill="#898781" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">주요 특징</text>
<text x="790" y="302" font-size="13" fill="#898781" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연 납입한도</text>
<text x="980" y="302" font-size="13" fill="#898781" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">투자법</text>
<rect x="48" y="320" width="1104" height="118" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<rect x="48" y="320" width="6" height="118" rx="3" fill="#2a78d6"/>
<rect x="76" y="359" width="40" height="40" rx="10" fill="#2a78d6"/>
<text x="96" y="386" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">①</text>
<text x="132" y="373" font-size="20" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연금저축 1</text>
<text x="132" y="395" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">세액공제 ○</text>
<text x="250" y="369.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">평생 동반자 통장 — 세액공제·과세이연 혜택을</text>
<text x="250" y="395.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">함께 받는 핵심 연금 통장</text>
<text x="790" y="386.0" font-size="24" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">600만원</text>
<circle cx="984" cy="376.0" r="5" fill="#2a78d6"/>
<text x="998" y="381.0" font-size="16" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">자산배분</text>
<rect x="48" y="452" width="1104" height="118" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<rect x="48" y="452" width="6" height="118" rx="3" fill="#008300"/>
<rect x="76" y="491" width="40" height="40" rx="10" fill="#008300"/>
<text x="96" y="518" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">②</text>
<text x="132" y="505" font-size="20" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연금저축 2</text>
<text x="132" y="527" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">세액공제 ×</text>
<text x="250" y="501.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">자유로운 영혼 통장 — 세액공제는 없지만</text>
<text x="250" y="527.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">필요할 때 자유롭게 인출 가능</text>
<text x="790" y="518.0" font-size="24" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">900만원</text>
<circle cx="984" cy="508.0" r="5" fill="#008300"/>
<text x="998" y="513.0" font-size="16" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">자산배분</text>
<rect x="48" y="584" width="1104" height="118" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<rect x="48" y="584" width="6" height="118" rx="3" fill="#e87ba4"/>
<rect x="76" y="623" width="40" height="40" rx="10" fill="#e87ba4"/>
<text x="96" y="650" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">③</text>
<text x="132" y="637" font-size="20" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">저축 IRP</text>
<text x="132" y="659" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">퇴직IRP와 별도 관리</text>
<text x="250" y="633.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">세액공제 더하기 통장 — 통장①의 한도를 채운</text>
<text x="250" y="659.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">후 추가 세액공제, 필요시 원리금보장상품 선택</text>
<text x="790" y="650.0" font-size="24" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">300만원</text>
<circle cx="984" cy="640.0" r="5" fill="#e87ba4"/>
<text x="998" y="645.0" font-size="16" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">TDF</text>
<rect x="48" y="716" width="1104" height="118" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
<rect x="48" y="716" width="6" height="118" rx="3" fill="#eda100"/>
<rect x="76" y="755" width="40" height="40" rx="10" fill="#eda100"/>
<text x="96" y="782" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">④</text>
<text x="132" y="769" font-size="20" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">ISA</text>
<text x="132" y="791" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">3년 만기, 분리과세</text>
<text x="250" y="765.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">징검다리 통장 — 3년 만기 후 비과세·분리과세,</text>
<text x="250" y="791.0" font-size="15" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">만기 자금 일부는 연금으로 전환 가능</text>
<text x="790" y="782.0" font-size="24" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">2,000만원</text>
<circle cx="984" cy="772.0" r="5" fill="#eda100"/>
<text x="998" y="777.0" font-size="16" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">월배당</text>
<text x="48" y="878" font-size="20" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연금 수령을 위한 5단계 전략</text>
<rect x="48.0" y="898" width="208.0" height="96" rx="12" fill="#cde2fb"/>
<circle cx="152.0" cy="924" r="17" fill="#2a78d6"/>
<text x="152.0" y="930" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">1</text>
<text x="152.0" y="962" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연금 계좌</text>
<text x="152.0" y="984" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">합치기</text>
<rect x="272.0" y="898" width="208.0" height="96" rx="12" fill="#cde2fb"/>
<circle cx="376.0" cy="924" r="17" fill="#2a78d6"/>
<text x="376.0" y="930" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">2</text>
<text x="376.0" y="962" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">월배당 중심으로</text>
<text x="376.0" y="984" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">포트폴리오 변경하기</text>
<rect x="496.0" y="898" width="208.0" height="96" rx="12" fill="#cde2fb"/>
<circle cx="600.0" cy="924" r="17" fill="#2a78d6"/>
<text x="600.0" y="930" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">3</text>
<text x="600.0" y="962" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">월배당금 설정·</text>
<text x="600.0" y="984" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">세금 체크하기</text>
<rect x="720.0" y="898" width="208.0" height="96" rx="12" fill="#cde2fb"/>
<circle cx="824.0" cy="924" r="17" fill="#2a78d6"/>
<text x="824.0" y="930" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">4</text>
<text x="824.0" y="962" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">수령 방식</text>
<text x="824.0" y="984" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">선택하기</text>
<rect x="944.0" y="898" width="208.0" height="96" rx="12" fill="#cde2fb"/>
<circle cx="1048.0" cy="924" r="17" fill="#2a78d6"/>
<text x="1048.0" y="930" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">5</text>
<text x="1048.0" y="962" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">자가배당 여부·</text>
<text x="1048.0" y="984" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">주식 비중 정하기</text>
</svg>
