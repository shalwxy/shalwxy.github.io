<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" width="1200" height="668" role="img" aria-label="월 투자금 200만 원을 연금저축1, 연금저축2, 저축IRP, ISA 네 통장에 배분하는 그림">
  <rect width="1200" height="668" fill="#fcfcfb"/>

  <text x="48" y="54" font-size="28" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">월 투자금 2,000,000원, 어디에 얼마씩?</text>
  <text x="48" y="84" font-size="15" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">《연금 부자 수업》의 월 200만 원 납입 시나리오를 바탕으로 재구성</text>

  <line x1="330" y1="120" x2="330" y2="648" stroke="#c3c2b7" stroke-width="1"/>

  
    <rect x="48" y="191" width="40" height="40" rx="10" fill="#2a78d6"/>
    <text x="68" y="217" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">①</text>

    <text x="104" y="205" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연금저축 1</text>
    <text x="104" y="225" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">세액공제 ○</text>
    <rect x="330" y="198" width="248" height="26" rx="4" fill="#2a78d6"/><text x="592" y="218.0" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">500,000원</text>
    <rect x="48" y="329" width="40" height="40" rx="10" fill="#008300"/>
    <text x="68" y="355" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">②</text>

    <text x="104" y="343" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">연금저축 2</text>
    <text x="104" y="363" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">세액공제 ×</text>
    <circle cx="336" cy="349.0" r="4" fill="#898781"/><text x="352" y="356.0" font-size="21" font-weight="700" fill="#898781" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">0원</text>
    <rect x="48" y="467" width="40" height="40" rx="10" fill="#e87ba4"/>
    <text x="68" y="493" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">③</text>

    <text x="104" y="481" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">저축 IRP</text>
    <text x="104" y="501" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">퇴직IRP와 별도 관리</text>
    <rect x="330" y="474" width="124" height="26" rx="4" fill="#e87ba4"/><text x="468" y="494.0" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">250,000원</text>
    <rect x="48" y="605" width="40" height="40" rx="10" fill="#eda100"/>
    <text x="68" y="631" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">④</text>

    <text x="104" y="619" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">ISA</text>
    <text x="104" y="639" font-size="13" fill="#52514e" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">3년 만기, 분리과세</text>
    <rect x="330" y="612" width="620" height="26" rx="4" fill="#eda100"/><text x="964" y="632.0" font-size="21" font-weight="700" fill="#0b0b0b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">1,250,000원</text>

</svg>
