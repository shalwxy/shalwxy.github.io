<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <rect x="0" y="0" width="400" height="210" fill="#ffffff"/>

  <!-- 간선 -->
  <g stroke="#2b2b2b" stroke-width="1.5">
    <line x1="200" y1="40" x2="120" y2="110"/>
    <line x1="200" y1="40" x2="280" y2="110"/>
    <line x1="120" y1="110" x2="70"  y2="180"/>
    <line x1="120" y1="110" x2="170" y2="180"/>
    <line x1="280" y1="110" x2="230" y2="180"/>
    <line x1="280" y1="110" x2="330" y2="180"/>
  </g>

  <!-- 노드 -->
  <g fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5">
    <circle cx="200" cy="40"  r="18"/>
    <circle cx="120" cy="110" r="18"/>
    <circle cx="280" cy="110" r="18"/>
    <circle cx="70"  cy="180" r="18"/>
    <circle cx="170" cy="180" r="18"/>
    <circle cx="230" cy="180" r="18"/>
    <circle cx="330" cy="180" r="18"/>
  </g>

  <g font-size="16" text-anchor="middle" fill="#2b2b2b" font-family="'Pretendard', -apple-system, sans-serif">
    <text x="200" y="46">1</text>
    <text x="120" y="116">2</text>
    <text x="280" y="116">3</text>
    <text x="70"  y="186">4</text>
    <text x="170" y="186">5</text>
    <text x="230" y="186">6</text>
    <text x="330" y="186">7</text>
  </g>
</svg>
