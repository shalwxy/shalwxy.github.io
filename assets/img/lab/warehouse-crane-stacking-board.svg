<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270">
  <rect x="0" y="0" width="400" height="270" fill="#ffffff"/>

  <!-- 크레인 레일과 집게 -->
  <line x1="30" y1="14" x2="250" y2="14" stroke="#555" stroke-width="3"/>
  <polyline points="150,14 150,30 140,38 160,38 150,30" fill="none" stroke="#555" stroke-width="2.5"/>

  <!-- 5x5 격자: 왼쪽 위 (30,40), 칸 40x40 -->
  <g stroke="#ccc" stroke-width="1" fill="none">
    <rect x="30" y="40" width="200" height="200"/>
    <line x1="70" y1="40" x2="70" y2="240"/>
    <line x1="110" y1="40" x2="110" y2="240"/>
    <line x1="150" y1="40" x2="150" y2="240"/>
    <line x1="190" y1="40" x2="190" y2="240"/>
    <line x1="30" y1="80" x2="230" y2="80"/>
    <line x1="30" y1="120" x2="230" y2="120"/>
    <line x1="30" y1="160" x2="230" y2="160"/>
    <line x1="30" y1="200" x2="230" y2="200"/>
  </g>

  <!-- 칸 안의 값 (0 포함 입력 그대로). 열 중심 x: 1=50 2=90 3=130 4=170 5=210 -->
  <g font-size="16" text-anchor="middle" font-family="'Pretendard', -apple-system, sans-serif">
    <text x="50"  y="65" fill="#bbb">0</text>
    <text x="90"  y="65" fill="#bbb">0</text>
    <text x="130" y="65" fill="#bbb">0</text>
    <text x="170" y="65" fill="#bbb">0</text>
    <text x="210" y="65" fill="#bbb">0</text>

    <text x="50"  y="105" fill="#bbb">0</text>
    <text x="90"  y="105" fill="#2b2b2b">1</text>
    <text x="130" y="105" fill="#bbb">0</text>
    <text x="170" y="105" fill="#bbb">0</text>
    <text x="210" y="105" fill="#2b2b2b">4</text>

    <text x="50"  y="145" fill="#2b2b2b">3</text>
    <text x="90"  y="145" fill="#2b2b2b">1</text>
    <text x="130" y="145" fill="#2b2b2b">2</text>
    <text x="170" y="145" fill="#bbb">0</text>
    <text x="210" y="145" fill="#2b2b2b">2</text>

    <text x="50"  y="185" fill="#2b2b2b">3</text>
    <text x="90"  y="185" fill="#2b2b2b">5</text>
    <text x="130" y="185" fill="#2b2b2b">5</text>
    <text x="170" y="185" fill="#2b2b2b">1</text>
    <text x="210" y="185" fill="#2b2b2b">4</text>

    <text x="50"  y="225" fill="#2b2b2b">2</text>
    <text x="90"  y="225" fill="#2b2b2b">5</text>
    <text x="130" y="225" fill="#2b2b2b">3</text>
    <text x="170" y="225" fill="#2b2b2b">1</text>
    <text x="210" y="225" fill="#2b2b2b">4</text>
  </g>

  <!-- 열 번호 (moves가 "2번 열"처럼 가리키는 값과 맞춰보기 위해 필요) -->
  <g font-size="13" fill="#555" text-anchor="middle" font-family="'Pretendard', -apple-system, sans-serif">
    <text x="50" y="258">1</text>
    <text x="90" y="258">2</text>
    <text x="130" y="258">3</text>
    <text x="170" y="258">4</text>
    <text x="210" y="258">5</text>
  </g>

  <!-- 바구니 -->
  <polygon points="270,150 340,150 332,240 278,240" fill="none" stroke="#2b2b2b" stroke-width="2"/>
</svg>
