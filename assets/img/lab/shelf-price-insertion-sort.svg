<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210">
  <rect x="0" y="0" width="460" height="210" fill="#ffffff"/>

  <!-- 1행: 정렬 전. idx0~2(15,32,47)는 정렬된 구간, idx3 자리는 키를 들어올려 빈칸(점선), idx4=21은 아직 안 본 구간 -->
  <g>
    <rect x="20"  y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="105" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="190" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="275" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="360" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  </g>

  <!-- idx3 자리에서 들어올린 키: 빈칸 바로 위에 배치 -->
  <rect x="275" y="0" width="60" height="50" rx="4" fill="#ffffff" stroke="#d1483f" stroke-width="2.5"/>

  <!-- 47, 32, 15가 한 칸씩 오른쪽으로 밀리는 화살표 (칸 사이 여백 전체를 사용) -->
  <line x1="250" y1="75" x2="273" y2="75" stroke="#2f6fed" stroke-width="2"/>
  <polygon points="273,75 263,70 263,80" fill="#2f6fed"/>
  <line x1="165" y1="75" x2="188" y2="75" stroke="#2f6fed" stroke-width="2"/>
  <polygon points="188,75 178,70 178,80" fill="#2f6fed"/>
  <line x1="80" y1="75" x2="103" y2="75" stroke="#2f6fed" stroke-width="2"/>
  <polygon points="103,75 93,70 93,80" fill="#2f6fed"/>

  <!-- 들어올린 키가 맨 앞 자리로 내려가 꽂히는 화살표. 빈칸 속을 지나 아래 여백으로 빠진 뒤 꺾인다 -->
  <path d="M 305 52 L 305 98 Q 170 130 55 138" fill="none" stroke="#d1483f" stroke-width="2"/>
  <polygon points="55,138 67,133 65,144" fill="#d1483f"/>

  <!-- 중간 연결선 (움직이지 않은 idx4) -->
  <line x1="390" y1="100" x2="390" y2="140" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 2행: 삽입 완료. idx0=9(초록, 자리 확정) -->
  <g>
    <rect x="20"  y="140" width="60" height="50" rx="4" fill="#ffffff" stroke="#2f9e44" stroke-width="2.5"/>
    <rect x="105" y="140" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="190" y="140" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="275" y="140" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="360" y="140" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  </g>

  <g font-size="18" text-anchor="middle" fill="#2b2b2b" font-family="'Pretendard', -apple-system, sans-serif">
    <text x="50"  y="81">15</text>
    <text x="135" y="81">32</text>
    <text x="220" y="81">47</text>
    <text x="305" y="31">9</text>
    <text x="390" y="81">21</text>

    <text x="50"  y="171">9</text>
    <text x="135" y="171">15</text>
    <text x="220" y="171">32</text>
    <text x="305" y="171">47</text>
    <text x="390" y="171">21</text>
  </g>
</svg>
