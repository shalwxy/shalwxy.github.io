<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <rect x="0" y="0" width="320" height="260" fill="#ffffff"/>

  <!-- 왼쪽 열: 호출이 내려가는 순서 (3 -> 2 -> 1 -> 0) -->
  <g>
    <rect x="30" y="20"  width="60" height="40" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="30" y="80"  width="60" height="40" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="30" y="140" width="60" height="40" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="30" y="200" width="60" height="40" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- 호출 화살표 (파랑, 아래로) -->
  <line x1="60" y1="60"  x2="60" y2="78"  stroke="#2f6fed" stroke-width="2"/>
  <polygon points="60,78 55,70 65,70" fill="#2f6fed"/>
  <line x1="60" y1="120" x2="60" y2="138" stroke="#2f6fed" stroke-width="2"/>
  <polygon points="60,138 55,130 65,130" fill="#2f6fed"/>
  <line x1="60" y1="180" x2="60" y2="198" stroke="#2f6fed" stroke-width="2"/>
  <polygon points="60,198 55,190 65,190" fill="#2f6fed"/>

  <!-- 오른쪽 열: 출력이 올라오는 순서 (1 -> 2 -> 3) -->
  <g>
    <rect x="220" y="140" width="60" height="40" rx="4" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
    <rect x="220" y="80"  width="60" height="40" rx="4" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
    <rect x="220" y="20"  width="60" height="40" rx="4" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
  </g>

  <!-- 출력 화살표 (초록, 위로) -->
  <line x1="250" y1="140" x2="250" y2="122" stroke="#2f9e44" stroke-width="2"/>
  <polygon points="250,122 245,130 255,130" fill="#2f9e44"/>
  <line x1="250" y1="80"  x2="250" y2="62"  stroke="#2f9e44" stroke-width="2"/>
  <polygon points="250,62 245,70 255,70" fill="#2f9e44"/>

  <!-- 같은 높이의 호출과 출력을 잇는 점선 -->
  <line x1="90"  y1="160" x2="220" y2="160" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="90"  y1="100" x2="220" y2="100" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="90"  y1="40"  x2="220" y2="40"  stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>

  <g font-size="18" text-anchor="middle" fill="#2b2b2b" font-family="'Pretendard', -apple-system, sans-serif">
    <text x="60" y="45">3</text>
    <text x="60" y="105">2</text>
    <text x="60" y="165">1</text>
    <text x="60" y="225" fill="#999999">0</text>

    <text x="250" y="165">1</text>
    <text x="250" y="105">2</text>
    <text x="250" y="45">3</text>
  </g>
</svg>
