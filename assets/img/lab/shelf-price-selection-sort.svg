<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <rect x="0" y="0" width="400" height="180" fill="#ffffff"/>

  <!-- 1행: 정렬 전. idx0=32(파란 점선, 이번 바퀴 채울 자리), idx3=9(빨강, 찾은 최솟값) -->
  <g>
    <rect x="30"  y="20" width="60" height="50" rx="4" fill="#ffffff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="100" y="20" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="170" y="20" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="240" y="20" width="60" height="50" rx="4" fill="#ffffff" stroke="#d1483f" stroke-width="2.5"/>
    <rect x="310" y="20" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  </g>

  <!-- 스왑 교차선: idx3(9)->idx0, idx0(32)->idx3 -->
  <line x1="270" y1="70" x2="60" y2="110" stroke="#d1483f" stroke-width="2"/>
  <polygon points="60,110 72,106 72,116" fill="#d1483f"/>
  <line x1="60" y1="70" x2="270" y2="110" stroke="#aaaaaa" stroke-width="2"/>
  <polygon points="270,110 258,106 258,116" fill="#aaaaaa"/>

  <!-- 변하지 않는 칸은 점선으로 이어줌 -->
  <line x1="130" y1="70" x2="130" y2="110" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="200" y1="70" x2="200" y2="110" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="340" y1="70" x2="340" y2="110" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 2행: idx0<->idx3 교체 후. idx0=9(초록, 자리 확정) -->
  <g>
    <rect x="30"  y="110" width="60" height="50" rx="4" fill="#ffffff" stroke="#2f9e44" stroke-width="2.5"/>
    <rect x="100" y="110" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="170" y="110" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="240" y="110" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="310" y="110" width="60" height="50" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  </g>

  <g font-size="18" text-anchor="middle" fill="#2b2b2b" font-family="'Pretendard', -apple-system, sans-serif">
    <text x="60"  y="51">32</text>
    <text x="130" y="51">15</text>
    <text x="200" y="51">47</text>
    <text x="270" y="51">9</text>
    <text x="340" y="51">21</text>

    <text x="60"  y="141">9</text>
    <text x="130" y="141">15</text>
    <text x="200" y="141">47</text>
    <text x="270" y="141">32</text>
    <text x="340" y="141">21</text>
  </g>
</svg>
