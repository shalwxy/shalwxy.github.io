<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="자물쇠를 향해 사방에서 모여드는 점들 — 분산 락 쟁탈전 일러스트">
  <defs>
    <linearGradient id="lr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#dde6ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#lr-bg)"/>

  <!-- converging arrows from 4 corners toward the lock -->
  <g stroke="#9aa6b2" stroke-width="6" fill="none" opacity="0.6">
    <line x1="260" y1="220" x2="520" y2="360"/>
    <line x1="940" y1="220" x2="680" y2="360"/>
    <line x1="260" y1="580" x2="520" y2="440"/>
    <line x1="940" y1="580" x2="680" y2="440"/>
  </g>

  <!-- competing node dots at the ends of the arrows -->
  <circle cx="260" cy="220" r="22" fill="#d1483a"/>
  <circle cx="940" cy="220" r="22" fill="#7b8fa6"/>
  <circle cx="260" cy="580" r="22" fill="#7b8fa6"/>
  <circle cx="940" cy="580" r="22" fill="#4f7a55"/>

  <!-- central lock -->
  <g transform="translate(600,400)">
    <circle r="110" fill="#fdfdfe" stroke="#c7ccd4" stroke-width="6"/>
    <rect x="-55" y="-10" width="110" height="90" rx="14" fill="#4a5a68"/>
    <path d="M -34 -10 L -34 -45 A 34 34 0 0 1 34 -45 L 34 -10"
          fill="none" stroke="#4a5a68" stroke-width="16"/>
    <circle cx="0" cy="38" r="12" fill="#fdd79a"/>
  </g>
</svg>
