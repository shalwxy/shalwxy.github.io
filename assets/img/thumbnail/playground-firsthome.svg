<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="집과 열쇠 일러스트">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e2"/>
      <stop offset="100%" stop-color="#ffe3d6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1483a"/>
      <stop offset="100%" stop-color="#b43a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="990" cy="160" r="70" fill="#ffd79a" opacity="0.8"/>

  <!-- ground -->
  <rect x="0" y="620" width="1200" height="180" fill="#f2e3cf"/>

  <!-- house body -->
  <rect x="420" y="400" width="360" height="230" rx="10" fill="#fdfaf4"/>
  <!-- roof -->
  <polygon points="390,410 600,250 810,410" fill="url(#roof)"/>
  <!-- chimney -->
  <rect x="700" y="290" width="36" height="90" fill="#b43a2e"/>

  <!-- door -->
  <rect x="560" y="500" width="80" height="130" rx="6" fill="#7b8fa6"/>
  <circle cx="622" cy="565" r="5" fill="#fdfaf4"/>

  <!-- windows -->
  <rect x="455" y="460" width="70" height="70" rx="6" fill="#bcd3e0"/>
  <rect x="675" y="460" width="70" height="70" rx="6" fill="#bcd3e0"/>
  <line x1="490" y1="460" x2="490" y2="530" stroke="#fdfaf4" stroke-width="5"/>
  <line x1="455" y1="495" x2="525" y2="495" stroke="#fdfaf4" stroke-width="5"/>
  <line x1="710" y1="460" x2="710" y2="530" stroke="#fdfaf4" stroke-width="5"/>
  <line x1="675" y1="495" x2="745" y2="495" stroke="#fdfaf4" stroke-width="5"/>

  <!-- key -->
  <g transform="translate(870,560) rotate(-20)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#4f7a55" stroke-width="16"/>
    <rect x="30" y="-8" width="90" height="16" fill="#4f7a55"/>
    <rect x="95" y="8" width="14" height="22" fill="#4f7a55"/>
    <rect x="118" y="8" width="14" height="30" fill="#4f7a55"/>
  </g>
</svg>
