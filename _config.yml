remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"
locale: "ko-KR"

title: "Persica"
subtitle: "Science, Life, and Side Projects"
description: "수학·공학·과학 정리, 일상 기록, 그리고 사이드 프로젝트 전시"
url: "https://persica.co.kr"
baseurl: ""
repository: "shalwxy/shalwxy.github.io"
search: true
naver_site_verification: "1d5f7499820718cfe546c2225dca7a86244bcfc8"

atom_feed:
  path: "/rss.xml"

tag_archive:
  type: liquid
  path: /tags/

author:
  name: "shalwxy"
  bio: "수학과 공학을 공부하고, 일상을 기록하고, 사이드 프로젝트를 만듭니다."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/shalwxy"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/shalwxy"

comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOPm0RSg"
    category_name: "Q&A"
    category_id: "DIC_kwDOPm0RSs4CuxMV"
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"
    lang: "ko"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-GWLCL52Q93"
    anonymize_ip: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

exclude:
  - docs/
  - private/
  - Gemfile
  - Gemfile.lock
  - vendor

collections:
  lab:
    output: true
    permalink: /:collection/:path/
  essay:
    output: true
    permalink: /:collection/:path/
  playground:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: lab
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "lab"
  - scope:
      path: ""
      type: essay
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "essay"
  - scope:
      path: ""
      type: playground
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "playground"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

timezone: Asia/Seoul
