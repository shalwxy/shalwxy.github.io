remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"
locale: "ko-KR"
date_format: "%Y-%m-%d"

title: "Persica"
description: "배우고 만들고 기록하는 Persica Hub"
url: "https://persica.co.kr"
baseurl: ""
repository: "shalwxy/shalwxy.github.io"
search: true
naver_site_verification: "1d5f7499820718cfe546c2225dca7a86244bcfc8"
# header.teaser/overlay_image가 없는 글(공유 카드, 카카오톡 공유용 이미지 등)을 위한 사이트 기본 이미지.
og_image: "/assets/img/thumbnail/hub-peach.jpg"

# lab/essay/playground 메인·카테고리 목록의 무한 스크롤 배치 크기(_layouts/folder.html, showcase.html).
infinite_scroll:
  per_batch: 10

kakao:
  # Kakao Developers(https://developers.kakao.com) 앱의 JavaScript 키.
  # 비어 있으면 글 하단 공유 버튼에서 카카오톡 버튼이 보이지 않는다.
  js_key: "0741f58360b683e2e40c852dbbf5970b"

atom_feed:
  path: "/rss.xml"
  hide: true

# path는 없다 — 태그 아카이브는 /lab/tags/, /essay/tags/, /playground/tags/로 서브 블로그별로
# 분리되어 있고 전역 /tags/ 페이지는 없다(_includes/tag-list.html 참고). type만 쓰여서
# 태그 링크가 #태그-슬러그 앵커를 쓰도록 한다.
tag_archive:
  type: liquid

author:
  name: "shalwxy"
  bio: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/shalwxy"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/shalwxy"

comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOPm0RSg"
    category_name: "Q&A"
    category_id: "DIC_kwDOPm0RSs4CuxMV"
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"
    lang: "ko"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-GWLCL52Q93"
    anonymize_ip: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

exclude:
  - docs/
  - private/
  - Gemfile
  - Gemfile.lock
  - vendor

collections:
  lab:
    output: true
    permalink: /:collection/:path/
  essay:
    output: true
    permalink: /:collection/:path/
  playground:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: lab
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      show_date: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "lab"
  - scope:
      path: ""
      type: essay
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      show_date: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "essay"
  - scope:
      path: ""
      type: playground
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "playground"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

timezone: Asia/Seoul
