{% endif %}

<script>
(function() {
  function setupMenu() {
    var nav = document.querySelector('.greedy-nav');
    if (!nav || nav.querySelector('.persica-nav')) return;

    var wrap = document.createElement('div');
    wrap.className = 'persica-nav';
    wrap.innerHTML =
      '<button class="persica-nav__btn" type="button" aria-label="메뉴" aria-expanded="false">' +
        '<i class="fas fa-bars" aria-hidden="true"></i>' +
      '</button>' +
      '<ul class="persica-nav__menu persica-nav__menu--hidden" role="menu">' +
        '<li role="none"><a role="menuitem" href="/lab/">Lab</a></li>' +
        '<li role="none"><a role="menuitem" href="/essay/">Essay</a></li>' +
        '<li role="none"><a role="menuitem" href="/playground/">Playground</a></li>' +
      '</ul>';
    nav.appendChild(wrap);

    var btn = wrap.querySelector('.persica-nav__btn');
    var menu = wrap.querySelector('.persica-nav__menu');

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = menu.classList.toggle('persica-nav__menu--hidden');
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
    document.addEventListener('click', function() {
      menu.classList.add('persica-nav__menu--hidden');
      btn.setAttribute('aria-expanded', 'false');
    });
    menu.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupMenu);
  } else {
    setupMenu();
  }
})();
</script>
