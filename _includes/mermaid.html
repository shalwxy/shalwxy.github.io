{%- comment -%}
  Mermaid 다이어그램 렌더링. kramdown+rouge는 mermaid 언어를 모르는 코드 블록이라 하이라이팅
  div 없이 <pre><code class="language-mermaid">...</code></pre>만 그대로 출력한다(rouge가 아는
  언어였다면 .highlight 래퍼가 붙는다) — 그 pre를 mermaid.js가 읽을 수 있는
  <div class="mermaid">...</div>로 바꿔치기한 다음 렌더링한다. scripts.html에서 본문에
  "language-mermaid"가 있는 글에서만 include한다.
{%- endcomment -%}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });

  mermaid.initialize({ startOnLoad: true });
</script>
